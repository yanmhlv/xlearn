name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  cpp:
    name: C++ (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # -march=native is left on: the binaries never leave the runner.
      - name: Configure
        run: cmake --preset dev

      - name: Build
        run: cmake --build --preset dev -j 4

      - name: Test
        run: ctest --preset dev

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: python -m pip install . scikit-learn pandas

      - name: Data conversion tests
        run: python -m unittest discover -s python-package/test -p 'test_data_conversion.py'

      # test_python.py reads its dataset from the working directory.
      - name: Train and predict on the criteo sample
        run: python ${{ github.workspace }}/python-package/test/test_python.py
        working-directory: demo/classification/criteo_ctr

  wheels:
    name: Wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The extension is built against the stable ABI from 3.12 on, so this one
      # build produces the abi3 wheel that covers every supported Python.
      - name: Build wheels
        run: |
          python -m pip install cibuildwheel
          python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: cp312-*
          CIBW_TEST_REQUIRES: scikit-learn
          CIBW_TEST_COMMAND: >
            python -m unittest discover
            -s {project}/python-package/test -p 'test_data_conversion.py'

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    name: Sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build
        run: |
          python -m pip install build
          python -m build --sdist

      - name: Install from the sdist alone
        run: python -m pip install dist/*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
